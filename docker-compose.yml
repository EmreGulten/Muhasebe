name: muhasebe

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accounting}
      POSTGRES_USER: ${POSTGRES_USER:-accounting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı.}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ önerisi: mount /var/lib/postgresql düzeyinde (veri alt dizinde).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-accounting} -d ${POSTGRES_DB:-accounting}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-accounting};Username=${POSTGRES_USER:-accounting};Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET .env dosyasında tanımlı olmalı (openssl rand -base64 48).}
      Jwt__Issuer: ${JWT_ISSUER:-accounting-api}
      Jwt__Audience: ${JWT_AUDIENCE:-accounting-web}
      App__FrontendUrl: http://localhost:${WEB_PORT:-3000}
      AllowedOrigins: http://localhost:${WEB_PORT:-3000}
      # AI asistan: anahtar boşsa offline mod (dış ağa istek çıkmaz).
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__BaseUrl: ${AI_BASE_URL:-https://api.openai.com/v1}
      Ai__Model: ${AI_MODEL:-gpt-4o-mini}
      Ai__MonthlyQuestionLimit: ${AI_MONTHLY_QUESTION_LIMIT:-100}
      ApplyMigrations: "true"
    ports:
      - "127.0.0.1:${API_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        # Rewrite'ler build anında değerlendirilir; compose ağı içindeki API adresi pişmeli.
        API_PROXY_URL: http://api:8080
    environment:
      API_PROXY_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
